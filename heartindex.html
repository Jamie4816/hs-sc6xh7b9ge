<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FF4D79"><title>하트 스터디</title><style>*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}</style></head><body><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 폰 한 손 조작 기준. 상단 헤더, 가운데 스크롤 본문, 하단 5탭. 형광펜 색은 과목 표시에만 쓰고, 하트 코랄이 유일한 강조색 */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --surface2:#E8ECF7; --ink:#18203F; --muted:#626B8A; --line:#D9DEEE;
  --heart:#FF4D79; --heart-soft:#FFE1E9; --blue:#3E6CF5; --good:#0E9F7A; --warn:#D98A00; --bad:#E0484F;
  --c1:#3E6CF5; --c2:#12B58C; --c3:#F2A20C; --c4:#8B5CF6; --c5:#FF7A45; --c6:#18A8DB; --c7:#E0529C; --c8:#7C8AA8;
  --shadow:0 1px 2px rgba(24,32,63,.05),0 8px 22px rgba(24,32,63,.06);
  --f-disp:'Jua','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hh:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1226; --surface:#181D3A; --surface2:#232950; --ink:#EEF0FB; --muted:#9BA4C8; --line:#2B3260;
  --heart:#FF6F93; --heart-soft:#3B2144; --blue:#7C9BFF; --good:#34D3A6; --warn:#F5B93A; --bad:#FF7A80;
  --c1:#7C9BFF; --c2:#34D3A6; --c3:#F5B93A; --c4:#A98BFF; --c5:#FF9A6B; --c6:#4CC6F0; --c7:#FF7FBB; --c8:#9AA6C4;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1226; --surface:#181D3A; --surface2:#232950; --ink:#EEF0FB; --muted:#9BA4C8; --line:#2B3260;
  --heart:#FF6F93; --heart-soft:#3B2144; --blue:#7C9BFF; --good:#34D3A6; --warn:#F5B93A; --bad:#FF7A80;
  --c1:#7C9BFF; --c2:#34D3A6; --c3:#F5B93A; --c4:#A98BFF; --c5:#FF9A6B; --c6:#4CC6F0; --c7:#FF7FBB; --c8:#9AA6C4;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:10px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto}
.disp{font-family:var(--f-disp);font-weight:400}
.ic{display:block;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.ttl{font-size:27px;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.topr{display:flex;align-items:center;gap:8px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;min-width:0;max-width:46vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.ch h2{font-size:15px;font-weight:700}
.ch small{color:var(--muted);font-size:12px}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:13px;margin-bottom:14px}
.note.warn{background:var(--heart-soft)}
.alert{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-radius:14px;background:var(--heart-soft);font-size:13px;font-weight:500;margin-bottom:10px}
.alert span{flex:1;min-width:0}
.alert .ic:first-child{color:var(--heart)}
.dstrip{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:0 2px}
.dbadge{font-family:var(--f-disp);font-size:22px;color:var(--heart);line-height:1}
.dstrip div{font-size:13px;color:var(--muted)}
.dstrip b{color:var(--ink);font-weight:500}

.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.card .seg{margin-bottom:12px}

.gauge-row{display:flex;align-items:center;gap:18px}
.gauge-w{width:128px;flex:none}
.gauge-w svg{width:100%;height:auto;display:block}
.hbg{fill:var(--heart-soft)}
.hfill{fill:var(--heart);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.hline{fill:none;stroke:var(--heart);stroke-width:3}
.big{font-size:46px;line-height:1.05}
.lab{font-size:12px;color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.kpis.k4{grid-template-columns:repeat(2,1fr)}
.kpis b{display:block;font-family:var(--f-disp);font-weight:400;font-size:21px;line-height:1.3}
.kpis span{font-size:12px;color:var(--muted)}

.chart{width:100%;height:auto;display:block}
.ct{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.ct.b{fill:var(--ink);font-weight:700}
.gl{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg u{display:inline-block;width:16px;border-top:2px dashed var(--muted);margin-right:5px;vertical-align:3px;text-decoration:none}
.leg s{display:inline-block;width:16px;border-top:2px solid var(--ink);margin-right:5px;vertical-align:3px;text-decoration:none}

.donut-row{display:flex;align-items:center;gap:14px}
.donut-row svg{width:112px;flex:none;height:auto}
.dl{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.dl div{display:flex;align-items:flex-start;gap:8px;line-height:1.35}
.dl i{width:10px;height:10px;border-radius:3px;flex:none;margin-top:5px}
.dl span{flex:1;min-width:0;overflow-wrap:anywhere}
.dl b{font-weight:500;white-space:nowrap;text-align:right;font-size:12px;color:var(--muted)}
.empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:34px;height:auto;fill:var(--heart-soft);margin:0 auto 6px;display:block}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px}
.dow.sa{color:var(--blue)}.dow.su{color:var(--bad)}
.cell{position:relative;min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:5px 0 3px;gap:2px}
.cell.e{pointer-events:none}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.sel{background:var(--surface2)}
.dn{font-size:13px;font-weight:500}
.hs{height:18px;display:block}
.hrt{width:18px;height:16px;fill:var(--heart);display:block}
.mface{width:18px;height:18px;display:block}.compact .mface{width:14px;height:14px}.flg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}.flg span{display:inline-flex;align-items:center;gap:4px}.flg svg{width:18px;height:18px}
.hrt.o{fill:none;stroke:var(--heart);stroke-width:9}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.compact .cell{min-height:44px;padding-top:3px}
.compact .hrt{width:14px;height:12px}
.compact .hs{height:12px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.nbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.nbtn:disabled{opacity:.35}

.up{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.up:first-of-type{border-top:0}
.up .dd{width:58px;flex:none;font-family:var(--f-disp);font-size:19px}
.up .ut{flex:1;min-width:0;display:flex;flex-direction:column}
.up .ut small{color:var(--muted);font-size:12px}
.ty{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--ink);white-space:nowrap}

.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.task.late{border-color:var(--warn)}
.chk{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.chk.done{background:var(--heart);border-color:var(--heart)}
.chk.miss{background:var(--muted);border-color:var(--muted)}
.chk.skip{border-style:dashed}
.tbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;color:color-mix(in srgb,var(--tc) 55%,var(--ink));background:color-mix(in srgb,var(--tc) 16%,var(--surface))}
.tt{font-weight:500;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.mini{font-size:12px;color:var(--muted);padding:7px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;flex:none}
.late-t{color:var(--warn);font-weight:700}

.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.bar.h i{background:var(--heart)}
.prog{display:flex;flex-direction:column;gap:12px}
.prow2{display:flex;flex-direction:column;gap:5px}
.prow2 .l{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.prow2 .l b{font-weight:500}
.prow2 .l span{color:var(--muted);font-size:12px}
.ttrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ttrow span{flex:none;font-size:12px;padding:4px 10px;border-radius:10px;background:var(--surface2)}
.ttrow em{font-style:normal;color:var(--muted);margin-right:4px}

.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--heart);border-color:var(--heart);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:var(--surface2);font-size:13px;min-height:38px}
.btn.sm{min-height:36px;font-size:13px;padding:0 14px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow .btn{flex:1}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700}
.dchip i{font-style:normal;font-size:10px;color:var(--muted);font-weight:400}
.dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip.on i{color:var(--bg);opacity:.75}
.tlbox{overflow:hidden;border-radius:14px;padding:12px 0}
.tl{position:relative;margin-left:44px;height:calc(var(--hh) * 18);border-left:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hl em{position:absolute;left:-44px;top:-9px;width:38px;text-align:right;font-style:normal;font-size:11px;color:var(--muted)}
.school{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface2) 0 7px,transparent 7px 14px);border-radius:8px;font-size:11px;color:var(--muted);padding:3px 8px;pointer-events:none}
.blk{position:absolute;border-radius:10px;background:color-mix(in srgb,var(--tc) 24%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);overflow:hidden;display:flex}
.blk.clash{border:2px dashed var(--bad)}
.blk.drag{box-shadow:0 10px 24px rgba(0,0,0,.28);z-index:6;opacity:.95}
.grip{width:26px;flex:none;display:grid;place-items:center;color:color-mix(in srgb,var(--tc) 55%,var(--ink));touch-action:none;cursor:grab;background:color-mix(in srgb,var(--tc) 32%,transparent)}
.bt{flex:1;min-width:0;text-align:left;padding:3px 7px;font-size:12px;line-height:1.3;overflow:hidden}
.bt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{color:var(--muted)}
.rs{position:absolute;left:26px;right:0;bottom:0;height:16px;touch-action:none;cursor:ns-resize}
.rs::after{content:'';position:absolute;left:50%;bottom:4px;width:30px;height:3px;border-radius:2px;background:var(--ink);opacity:.35;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--muted);margin:2px 2px 12px}
.warnline{font-size:12px;color:var(--bad);margin:0 2px 10px}
.mxw{overflow-x:auto}
.mx{width:100%;border-collapse:collapse;font-size:12px;min-width:300px}
.mx th,.mx td{padding:6px 2px;text-align:center}
.mx th{font-weight:500;color:var(--muted)}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:2px}
.mx td.v{border-radius:6px;background:color-mix(in srgb,var(--tc) calc(var(--a) * 1%),transparent)}
.mx tfoot td{font-weight:700;border-top:1px solid var(--line)}

.mrow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow .l{display:flex;align-items:center;gap:8px}
.mrow .l b{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.mrow small{color:var(--muted);font-size:12px}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row label{font-size:14px}
.set-row input[type=number],.set-row input[type=time],.set-row select{width:112px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);width:100%}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0}
.srow input[type=text]{flex:1;min-width:0}
.cdots{display:flex;gap:4px}
.cdots button{width:20px;height:20px;border-radius:50%;border:2px solid transparent}
.cdots button.on{border-color:var(--ink)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rchips span{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--surface2);font-size:13px}
.rchips button{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.ttg{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.ttg th{font-size:12px;color:var(--muted);font-weight:500}
.ttg input{min-height:38px;padding:0 2px;text-align:center;font-size:15px}
.ttg td:first-child{width:28px;text-align:center;color:var(--muted);font-size:12px}

#sheet .scrim{position:fixed;inset:0;background:rgba(10,14,34,.5);z-index:30}
#sheet .panel{position:fixed;z-index:31;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);max-height:90%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
#sheet .psc{overflow-y:auto;overscroll-behavior:contain;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.psc h3{font-family:var(--f-disp);font-weight:400;font-size:22px;margin-bottom:4px}
.psc label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.sub2{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.step{display:flex;gap:6px;align-items:center}
.step button{width:46px;height:44px;border-radius:12px;background:var(--surface2);font-size:20px;flex:none}
.step input{text-align:center}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.why{font-size:13px;color:var(--bad);margin-top:8px}
.prow{display:flex;gap:8px;margin-bottom:8px}
.pbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px 8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.pbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.av{display:block;flex:none;border-radius:50%}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.avopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted)}
.avopt.on{border-color:var(--heart);box-shadow:inset 0 0 0 1px var(--heart);color:var(--ink);font-weight:700}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.pv{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:6px}
.big-ph{display:block;width:100%;max-height:55vh;object-fit:contain;border-radius:12px;margin-top:10px;background:var(--surface2)}
.range{display:flex;align-items:center;gap:8px}
.range input{text-align:center;min-width:0}
.range em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
input[type=file]{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px dashed var(--line);background:var(--surface2);font-size:14px}
.pbtn.on{border-color:var(--heart);box-shadow:inset 0 0 0 1px var(--heart)}
.pbtn small{color:var(--muted);font-weight:400}
.pbtn em{font-style:normal;font-size:11px;background:var(--surface2);padding:1px 7px;border-radius:999px;margin-left:4px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);border-radius:12px}

function lanes(items){

}

}

function openSheet(kind,f){
  ui.sheet={kind,f};const sh=$('#sheet');sh.hidden=false;$('#toast').hidden=true;
  sh.innerHTML='<div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div class="psc" id="psc"></div></div>';

}

function openTask(mode,w){const d=D();openSheet('task',{subj:d.subjects[0]?d.subjects[0].id:'',title:'',matId:'',amt:0,min:30,start:'19:00',mode,days:[w==null?wd(ui.date):w],date:ui.date,err:''})}

const choreList=(d,f)=>{const l=d.chores.filter(j=>!f.place||!j.place||j.place===f.place);return l.length?l:d.chores};
const isRoomRule=(d,id)=>{const r=d.rules.find(x=>x.id===id);return !!r&&(r.id==='u3'||r.text.includes('내 방'))};
const nz=v=>v===''||v==null?'':v;
function rangeIn(f){const a=String(f.from==null?'':f.from).trim(),b=String(f.to==null?'':f.to).trim();return{a:a===''?'':+a,b:b===''?'':+b}}
function calcRange(f,fb){
  let{a,b}=rangeIn(f);
  if(a===''&&b===''){return fb?{from:fb.from,to:fb.to,amt:fb.amt}:{from:'',to:'',amt:0}}
  if(a==='')a=b;if(b==='')b=a;
  if(!(a>=0)||!(b>=0))return{err:'쪽수는 숫자로 적어 주세요.'};
  if(b<a)return{err:'끝 쪽수가 시작 쪽수보다 작아요.'};
  return{from:a,to:b,amt:b-a+1};
}
function openOcc(key){const d=D(),[,tid]=key.split('|'),t=d.tasks.find(x=>x.id===tid);if(!t)return;const c=d.checks[key],m=t.matId?mat(d,t.matId):null,pos=m?matPos(d,m):0,has=c&&c.s==='done';
  openSheet('occ',{key,min:c&&c.min?c.min:t.min,from:has?nz(c.from):'',to:has?nz(c.to):'',note:c&&c.note?c.note:'',dfrom:pos+1,dto:pos+Math.max(1,t.amt||1),showMin:false,err:''})}

 },

  }

 tasksave(){
  syncForm();const f=ui.sheet.f,d=D();f.err='';
  if(!String(f.title).trim())f.err='무엇을 할지 적어 주세요.';
  else if(!(+f.min>0))f.err='계획 시간을 정해 주세요.';
  else if(f.mode==='repeat'&&!f.days.length)f.err='요일을 하나 이상 골라 주세요.';
  else if(f.mode==='once'&&!f.date)f.err='날짜를 골라 주세요.';
  else if(!f.start)f.err='시작 시간을 정해 주세요.';
  if(f.err){sheetRefresh();return}
  const base={subj:f.subj,title:String(f.title).trim(),matId:f.matId||'',amt:f.matId?(+f.amt||0):0,min:+f.min,start:f.start};
  const once=f.mode==='once';
  const patch=once?{...base,date:f.date,days:[],from:f.date}:{...base,date:'',days:f.days.slice().sort((a,b)=>a-b),from:today()};
  if(f.id){const t=taskById(f.id);if(!once&&t.date)patch.from=today();else if(!once)delete patch.from;editTask(t,patch)}

 },

 /* checks */
 quick(el){

 },

 occdone(){syncForm();const f=ui.sheet.f,d=D(),[date,tid]=f.key.split('|'),t=d.tasks.find(x=>x.id===tid);if(!t)return;if(date>today()){toast('아직 오지 않은 날이에요');return}

let drag=null;const HH=48;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip,.rs');if(!g)return;
  const blk=g.closest('.blk'),t=taskById(blk.dataset.id);if(!t)return;
  e.preventDefault();
  drag={mode:g.classList.contains('rs')?'resize':'move',blk,t,y0:e.clientY,s0:hm2min(t.start),m0:t.min,ns:hm2min(t.start),nm:t.min,pid:e.pointerId,moved:false};
  try{g.setPointerCapture(e.pointerId)}catch(x){}
  blk.classList.add('drag');
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const dm=Math.round((e.clientY-drag.y0)/HH*60/5)*5;
  if(drag.mode==='move')drag.ns=clamp(drag.s0+dm,360,1440-drag.m0);
  else drag.nm=clamp(drag.m0+dm,10,Math.min(300,1440-drag.s0));
  drag.moved=true;
  drag.blk.style.top=((drag.ns-360)/60*HH)+'px';
  drag.blk.style.height=Math.max(34,drag.nm/60*HH-2)+'px';
  const sp=$('[data-tl]',drag.blk);if(sp)sp.textContent=`${min2hm(drag.ns)}~${min2hm(drag.ns+drag.nm)} · ${fmtShort(drag.nm)}`;
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  const dg=drag;drag=null;dg.blk.classList.remove('drag');
  if(!cancel&&(dg.ns!==dg.s0||dg.nm!==dg.m0))editTask(dg.t,{start:min2hm(dg.ns),min:dg.nm});
  render();
}
document.addEventListener('pointerup',e=>endDrag(e,false));

function buildReport(){
  const R={'학습기록':[['날짜','학생','과목','내용','결과','교재','시작','끝','시간(분)','못 한 이유','메모']],'지적·시정':[['날짜','학생','규칙','위치','내용','시정한 날']],'집안일':[['날짜','학생','위치','한 일','포인트']],'포인트 사용':[['날짜','학생','포인트','내용']]};
  const RS={done:'완료',miss:'못 함',skip:'건너뜀',post:'미룸'};
  for(const pr of S.profiles){
    const d=S.data[pr.id],nm=pr.name;
    const rows=[];
    for(const [k,c] of Object.entries(d.checks||{})){const [date,tid]=k.split('|'),t=(d.tasks||[]).find(x=>x.id===tid);if(!t)continue;const m=mat(d,t.matId);rows.push([date,nm,subj(d,t.subj).name,t.title||'',RS[c.s]||c.s,m?m.name:'',c.from??'',c.to??'',c.min||'',c.why||'',c.note||''])}
    for(const x of d.extra||[]){const m=mat(d,x.matId);rows.push([x.date,nm,subj(d,x.subj).name,'추가 공부','완료',m?m.name:'',x.from??'',x.to??'',x.min||'','',x.note||''])}
    rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));R['학습기록'].push(...rows);
    for(const v of (d.viol||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)))){const r=(d.rules||[]).find(x=>x.id===v.rule);R['지적·시정'].push([v.date,nm,r?r.text:'',v.place||'',v.note||'',v.fixed||''])}
    for(const x of (d.clog||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))))R['집안일'].push([x.date,nm,x.place||'',x.job||'',x.pts||0]);
    for(const x of (d.spent||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))))R['포인트 사용'].push([x.date,nm,x.pts||0,x.note||'']);
  }
  return R}
function syncPush(){if(SYNC.state!=='on'||!SYNC.ready)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(doPush,800)}
async function doPush(){
  if(SYNC.busy){SYNC.again=1;return}SYNC.busy=1;
  try{
    const put={},del=[],pj={};
    const meta={profiles:S.profiles,pin:S.pin||'',pinr:S.pinr||''},mj=cj(meta);
    if(mj!==SYNC.lastMeta)put.meta=JSON.stringify(meta);
    for(const pr of S.profiles){const j=cj(S.data[pr.id]);if(SYNC.pushed[pr.id]!==j){put['p_'+pr.id]=JSON.stringify(S.data[pr.id]);pj[pr.id]=j}}
    for(const id of Object.keys(SYNC.pushed))if(!S.data[id])del.push('p_'+id);
    if(Object.keys(put).length||del.length){
      await syncCall({put,del,report:buildReport()});
      SYNC.lastMeta=mj;for(const id in pj){SYNC.pushed[id]=pj[id];SYNC.seen[id]=pj[id]}
      for(const k of del){const id=k.slice(2);delete SYNC.pushed[id];delete SYNC.seen[id]}
      SYNC.lastGet='';
    }
    syncSet('on')
  }catch(e){syncSet('err',e.message)}
  SYNC.busy=0;if(SYNC.again){SYNC.again=0;doPush()}
}
function syncApply(first){
  if(!SYNC.ready||!SYNC.meta)return;
  if(ui.sheet){SYNC.defer=1;return}
  const profs=SYNC.meta.profiles||[];if(!profs.length)return;
  const data={};let ch=cj(profs)!==cj(S.profiles)||(SYNC.meta.pin||'')!==(S.pin||'')||(SYNC.meta.pinr||'')!==(S.pinr||'');
  for(const pr of profs){
    const loc=S.data[pr.id],rem=SYNC.docs[pr.id];
    const dirty=!first&&loc&&SYNC.pushed[pr.id]!==cj(loc);
    if(rem&&!dirty){const rj=cj(rem);if(first||rj!==SYNC.seen[pr.id]){data[pr.id]=JSON.parse(JSON.stringify(rem));ch=true}else data[pr.id]=loc||JSON.parse(JSON.stringify(rem));SYNC.seen[pr.id]=rj}
    else data[pr.id]=loc||blankData();
  }
  if(!ch)return;
  S=normalize({...S,pin:SYNC.meta.pin||'',pinr:SYNC.meta.pinr||'',profiles:JSON.parse(JSON.stringify(profs)),data});
  SYNC.lastMeta=cj({profiles:profs,pin:S.pin||'',pinr:S.pinr||''});
  for(const pr of S.profiles)SYNC.pushed[pr.id]=cj(S.data[pr.id]);
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render();
}
async function syncPull(first){
  const {j,txt}=await syncCall();
  if(!first&&txt===SYNC.lastGet)return;
  SYNC.lastGet=txt;
  SYNC.meta=j.meta||null;SYNC.docs=j.docs||{};
  if(first){
    SYNC.ready=true;
    if(SYNC.meta&&(SYNC.meta.profiles||[]).length){
      const diff=S.profiles.some(pr=>!pr.sample&&(!SYNC.docs[pr.id]||cj(S.data[pr.id])!==cj(SYNC.docs[pr.id])));
      if(diff){try{if(!localStorage.getItem('heart-study-prelink'))localStorage.setItem('heart-study-prelink',JSON.stringify(S))}catch(e){}}
      syncApply(true);
    }else if(S.profiles.some(pr=>!pr.sample)){SYNC.state='on';await doPush()}
  }else syncApply(false);
}
async function syncStart(){
  const c=syncCfg();clearInterval(SYNC.poll);SYNC.ready=false;SYNC.pushed={};SYNC.seen={};SYNC.lastMeta='';SYNC.lastGet='';
  if(!c.url||!c.key){syncSet('off');return}
  syncSet('init');
  try{await syncPull(true);syncSet('on')}catch(e){syncSet('err',e.message);return}
  SYNC.poll=setInterval(()=>{if(document.hidden||SYNC.busy||SYNC.state==='init')return;syncPull(false).then(()=>syncSet('on')).catch(e=>syncSet('err',e.message))},20000);
}
async function syncConnect(){
  const url=($('#sy-url').value||'').trim(),key=($('#sy-key').value||'').trim();
  if(!/^https:\/\/script\.google\.com\/.+/.test(url)){toast('주소가 script.google.com 으로 시작해야 해요');return}
  if(key.length<8){toast('비밀 문자열은 8자 이상으로 해 주세요');return}
  try{localStorage.setItem(SYNC_CFG,JSON.stringify({url,key}))}catch(e){toast('이 브라우저는 설정을 저장할 수 없어요');return}
  await syncStart();
  toast(SYNC.state==='on'?'연결했어요':'연결하지 못했어요')
}
function syncDisconnect(){try{localStorage.removeItem(SYNC_CFG)}catch(e){}clearInterval(SYNC.poll);SYNC.ready=false;syncSet('off');render();toast('연결을 끊었어요. 이 기기의 기록은 그대로예요')}
function syncNow(){if(SYNC.state==='init')return;syncPull(false).then(()=>{syncSet('on');doPush();toast('맞췄어요')}).catch(e=>{syncSet('err',e.message);toast('연결하지 못했어요')})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SYNC.ready&&SYNC.state==='on'&&!SYNC.busy)syncPull(false).catch(()=>{})});
const _closeSheet=closeSheet;
closeSheet=function(){_closeSheet.apply(this,arguments);if(SYNC.defer){SYNC.defer=0;syncApply(false)}};

syncStart();

window.__heart={SYNC,syncStart,S:()=>S,ui,render,ACT,rollover,resetRolled:()=>{rolled=''}};
})();
</script>
</body></html>
